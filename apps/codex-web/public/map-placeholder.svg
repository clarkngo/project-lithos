<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder survey of the Lithoi extraction country</title>
  <desc id="desc">West: deep-strata mine and forest. Center: Hollow Cut. East: Glass Wastes and a sealed Vault mark. North: the Spire, location unconfirmed.</desc>
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#1b2418"/>
      <stop offset="38%" stop-color="#2a241c"/>
      <stop offset="62%" stop-color="#3a2a22"/>
      <stop offset="100%" stop-color="#5a4633"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c4a574" stroke-width="0.6" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="#14110e"/>
  <rect x="36" y="36" width="1128" height="648" fill="url(#land)" stroke="#c4a574" stroke-width="1.5"/>
  <rect x="36" y="36" width="1128" height="648" fill="url(#hatch)"/>

  <!-- Forest mass -->
  <path d="M80 420 C140 300 220 260 310 280 C380 295 420 360 400 430 C370 520 240 560 140 530 C90 510 70 460 80 420 Z" fill="#24301f" stroke="#8a7350" stroke-width="1"/>
  <text x="210" y="400" fill="#e8dfd2" font-family="Georgia, serif" font-size="18" text-anchor="middle">Forest above the mine</text>

  <!-- Mine / deep strata -->
  <circle cx="168" cy="510" r="18" fill="#7a3d22" stroke="#e09a3e" stroke-width="2"/>
  <text x="168" y="560" fill="#e09a3e" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">DEEP STRATA</text>
  <text x="168" y="576" fill="#9a8e7e" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Caelen's origin</text>

  <!-- Hollow Cut -->
  <rect x="430" y="330" width="22" height="22" fill="#c4a574" transform="rotate(45 441 341)"/>
  <text x="470" y="338" fill="#e8dfd2" font-family="Georgia, serif" font-size="20">Hollow Cut</text>
  <text x="470" y="358" fill="#9a8e7e" font-family="ui-monospace, monospace" font-size="11">fringe settlement</text>

  <!-- Glass Wastes -->
  <path d="M620 220 L1120 180 L1120 620 L700 640 C640 500 600 360 620 220 Z" fill="#6b5a45" opacity="0.85" stroke="#e09a3e" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="860" y="380" fill="#e8dfd2" font-family="Georgia, serif" font-size="28" text-anchor="middle">The Glass Wastes</text>
  <text x="860" y="406" fill="#9a8e7e" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">over-mined badlands · patrols thin</text>

  <!-- Vault -->
  <rect x="940" y="250" width="70" height="54" fill="#14110e" stroke="#c4a574" stroke-width="2"/>
  <line x1="940" y1="250" x2="1010" y2="304" stroke="#7a3d22" stroke-width="1.5"/>
  <line x1="1010" y1="250" x2="940" y2="304" stroke="#7a3d22" stroke-width="1.5"/>
  <text x="975" y="330" fill="#e09a3e" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">THE VAULT</text>
  <text x="975" y="346" fill="#9a8e7e" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">sealed · location unconfirmed</text>

  <!-- Spire -->
  <polygon points="640,90 652,150 628,150" fill="#c4a574"/>
  <text x="668" y="120" fill="#e8dfd2" font-family="Georgia, serif" font-size="18">The Spire</text>
  <text x="668" y="138" fill="#9a8e7e" font-family="ui-monospace, monospace" font-size="10">Seraphina's origin · polity TBD</text>

  <!-- Compass -->
  <g transform="translate(90 90)">
    <circle r="28" fill="none" stroke="#c4a574" stroke-width="1"/>
    <polygon points="0,-22 6,4 0,0 -6,4" fill="#e09a3e"/>
    <text y="-34" fill="#c4a574" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">N</text>
  </g>

  <text x="60" y="660" fill="#8a7350" font-family="ui-monospace, monospace" font-size="11">PLACEHOLDER SURVEY · not to scale · confirm against manuscript</text>
</svg>
